name: macOS bottle

# Manually-triggered workflow that builds macOS arm64 Homebrew bottles for
# mulle-clang-project on Namespace (namespace.so) runners — one per macOS
# version — and uploads them to the matching GitHub release.
#
# AUTHORED by mulle-clang-project-bottle-ci.mrc. Edit the template in the bundle
# and re-run the MRC; do not hand-edit the copy in the repo.
#
# EXECUTION SHAPE (one dispatch → four bottles, canary-first):
#   1. canary-select : runs on GitHub's `macos-latest` ONLY to detect which OS
#                      `macos-latest` currently is, maps it to a codename, and
#                      resolves the matching Namespace runner. If there is no
#                      matching namespace-profile-macos-arm-<codename>, it HARD
#                      FAILS — intervention time: create the namespace runner.
#                      (No building here; macos-latest is too weak for clang.)
#   2. canary        : builds+uploads on the Namespace runner for the detected
#                      OS. Proves the whole path on ONE powerful runner first.
#   3. fanout        : the OTHER macOS versions build in parallel, after canary
#                      is green. fail-fast:false so a beta flake can't kill peers.
#
# PRE-RELEASE SAFE: builds from an IN-REPO staged formula via a FAKED LOCAL TAP
# (brew tap-new). The public mulle-kybernetik/software tap is never tapped or
# published here, so users are not hoisted onto the new compiler.
#
# IDEMPOTENT / COST-AWARE: each build job first checks whether its bottle already
# exists on the release and SKIPS the ~1h build if so (no error). One dispatch
# builds the four; a re-dispatch only fills the MISSING ones. force=true rebuilds.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the bottle for (e.g. 22.1.8.7)"
        required: true
        type: string
      force:
        description: "Rebuild even if a bottle already exists on the release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  LOCAL_TAP: "mulle-cc/prerelease"
  FORMULA_NAME: "mulle-clang-project"
  FORMULA_IN_REPO: ".github/workflows/mulle-clang-project.rb"
  GITHUB_REPO: "mulle-cc/mulle-clang-project"
  # All macOS versions we build, and their Namespace runner profiles.
  # Used by fanout; canary is chosen dynamically from macos-latest.
  ALL_CODENAMES: "sonoma sequoia tahoe golden-gate"

jobs:
  # ----------------------------------------------------------------------------
  # canary-select — detect what `macos-latest` is RIGHT NOW and map to a runner.
  # Runs on macos-latest purely to read the OS version (cheap; no build).
  # ----------------------------------------------------------------------------
  canary-select:
    runs-on: macos-latest
    outputs:
      codename: ${{ steps.detect.outputs.codename }}
      runner: ${{ steps.detect.outputs.runner }}
      others: ${{ steps.detect.outputs.others }}
    steps:
      - name: Detect macos-latest OS and resolve namespace runner
        id: detect
        run: |
          set -euo pipefail
          major="$( sw_vers -productVersion | cut -d. -f1 )"
          echo "macos-latest productVersion: $( sw_vers -productVersion ) (major=${major})"

          # OS major -> Homebrew codename. Update when a new macOS goes GA.
          case "${major}" in
            14) codename="sonoma" ;;
            15) codename="sequoia" ;;
            26) codename="tahoe" ;;
            *)
              echo "::error::macos-latest is macOS major ${major}, which has no codename mapping. INTERVENTION NEEDED: add the mapping and create a namespace-profile-macos-arm-<codename> runner." >&2
              exit 1
              ;;
          esac
          echo "detected codename: ${codename}"

          # Must have a matching namespace runner profile among ALL_CODENAMES.
          match=0
          for c in ${ALL_CODENAMES}; do [ "${c}" = "${codename}" ] && match=1; done
          if [ "${match}" != "1" ]; then
            echo "::error::No namespace runner for '${codename}' (not in ALL_CODENAMES='${ALL_CODENAMES}'). INTERVENTION NEEDED: create namespace-profile-macos-arm-${codename}." >&2
            exit 1
          fi

          runner="namespace-profile-macos-arm-${codename}"

          # Compute the OTHER codenames (fanout) as a JSON matrix.
          others_json=""
          for c in ${ALL_CODENAMES}; do
            [ "${c}" = "${codename}" ] && continue
            others_json="${others_json}{\"codename\":\"${c}\",\"runner\":\"namespace-profile-macos-arm-${c}\"},"
          done
          others="{\"include\":[${others_json%,}]}"

          echo "canary runner: ${runner}"
          echo "fanout matrix: ${others}"
          echo "codename=${codename}" >> "${GITHUB_OUTPUT}"
          echo "runner=${runner}"     >> "${GITHUB_OUTPUT}"
          echo "others=${others}"     >> "${GITHUB_OUTPUT}"

  # ----------------------------------------------------------------------------
  # canary — build+upload the detected OS on its Namespace runner (prove path).
  # ----------------------------------------------------------------------------
  canary:
    needs: canary-select
    runs-on: ${{ needs.canary-select.outputs.runner }}
    steps:
      - name: Check out repo (staged formula + build script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build and upload bottle (${{ needs.canary-select.outputs.codename }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          CODENAME: ${{ needs.canary-select.outputs.codename }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/${FORMULA_IN_REPO%/*}/bottle-build.sh"
        # Build logic is factored into bottle-build.sh (staged in-repo by the MRC)
        # so canary and fanout run byte-identical steps.

  # ----------------------------------------------------------------------------
  # fanout — the OTHER macOS versions, in parallel, only after canary is green.
  # ----------------------------------------------------------------------------
  fanout:
    needs: [canary-select, canary]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.canary-select.outputs.others) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repo (staged formula + build script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build and upload bottle (${{ matrix.codename }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          CODENAME: ${{ matrix.codename }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/${FORMULA_IN_REPO%/*}/bottle-build.sh"
