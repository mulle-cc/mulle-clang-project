name: macOS bottle

# Manually-triggered workflow that builds a macOS arm64 Homebrew bottle for
# mulle-clang-project on a Namespace (namespace.so) runner and uploads it to the
# matching GitHub release.
#
# This file is AUTHORED by the mulle-clang-project-bottle-ci.mrc bundle. Do not
# hand-edit in place; edit the template in the .mrc bundle and re-run the MRC so
# the source of truth stays the bundle.
#
# COST NOTE: the build compiles all of LLVM/clang and runs ~1h on a paid arm64
# macOS runner. The `preflight` step below verifies the things that can only be
# known at run time and would otherwise waste that hour:
#   1. the release for <tag> still exists
#   2. this run's token reports write permission
#   3. an actual asset upload to that release SUCCEEDS (proven with a throwaway
#      dummy asset that is uploaded, verified, then deleted) — this is the #1
#      real-world failure and MUST be caught before the build, not after.
# Everything else (formula validity, tap resolution, runner label, release
# existence at authoring time) is guaranteed earlier by the MRC, so it is NOT
# re-checked here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the bottle for (e.g. 22.1.8.7)"
        required: true
        type: string

permissions:
  contents: write   # required for `gh release upload`

env:
  # We build from an IN-REPO formula via a FAKED LOCAL TAP (brew tap-new on the
  # runner). We deliberately do NOT tap the public mulle-kybernetik/software tap:
  # this is a pre-release, and tapping/publishing there would hoist the new
  # compiler onto users. The local tap exists only on the runner for this job.
  LOCAL_TAP: "mulle-cc/prerelease"
  FORMULA_NAME: "mulle-clang-project"
  # Path to the formula inside this repo checkout (installed alongside bottle.yml
  # by the MRC). This is the 22.1.8.7 formula, staged for the pre-release.
  FORMULA_IN_REPO: ".github/workflows/mulle-clang-project.rb"
  GITHUB_REPO: "mulle-cc/mulle-clang-project"

jobs:
  bottle:
    # Namespace macOS arm64 runner profile (Apple silicon). This label is
    # account/profile-specific and is recorded in the MRC db.json.
    runs-on: namespace-profile-mulle-clang
    steps:
      # --------------------------------------------------------------------
      # PREFLIGHT — cheap, run BEFORE the expensive build. Abort on any failure
      # so we never pay for a build we cannot publish.
      # --------------------------------------------------------------------
      - name: Preflight — release exists and token can upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          echo "::group::Check release '${TAG}' exists on ${GITHUB_REPO}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPO}" >/dev/null 2>&1
          then
            echo "::error::Release '${TAG}' does not exist on ${GITHUB_REPO}. Create the release before dispatching this workflow." >&2
            exit 1
          fi
          echo "release '${TAG}' present"
          echo "::endgroup::"

          echo "::group::Prove this run's token can upload to the release"
          # NOTE: we deliberately do NOT gate on `gh api repos/{repo} .permissions.push`
          # here. For the ephemeral Actions GITHUB_TOKEN that field does not reliably
          # report write capability (it reflects the actor/installation differently
          # than a user PAT), so it produces false negatives. The AUTHORITATIVE test
          # is an actual asset upload round-trip, below.
          probe="__bottle-upload-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'bottle upload preflight probe for %s\n' "${TAG}" > "${probe}"

          # Upload (clobber in case a prior attempt left one behind).
          if ! gh release upload "${TAG}" "${probe}" --repo "${GITHUB_REPO}" --clobber
          then
            echo "::error::Dummy asset upload FAILED — the real bottle upload would also fail. Aborting before the expensive build." >&2
            rm -f "${probe}"
            exit 1
          fi

          # Verify it is actually listed on the release.
          if ! gh release view "${TAG}" --repo "${GITHUB_REPO}" --json assets \
                 --jq '.assets[].name' | grep -qxF "${probe}"
          then
            echo "::error::Dummy asset uploaded but not found on the release; upload path is unreliable. Aborting." >&2
            gh release delete-asset "${TAG}" "${probe}" --repo "${GITHUB_REPO}" --yes >/dev/null 2>&1 || true
            rm -f "${probe}"
            exit 1
          fi

          # Clean up the probe — it must never linger next to real bottles.
          if ! gh release delete-asset "${TAG}" "${probe}" --repo "${GITHUB_REPO}" --yes
          then
            echo "::warning::Could not delete probe asset '${probe}'; please remove it manually." >&2
          fi
          rm -f "${probe}"
          echo "upload path verified end-to-end (probe uploaded, listed, and removed)"
          echo "::endgroup::"

      - name: Check out repo (for the staged formula)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Homebrew
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null 2>&1
          then
            echo "::error::brew not found on runner" >&2
            exit 1
          fi
          brew --version

      - name: Create fake local tap from staged formula
        run: |
          set -euo pipefail
          if [ ! -f "${FORMULA_IN_REPO}" ]
          then
            echo "::error::staged formula not found at ${FORMULA_IN_REPO}" >&2
            exit 1
          fi
          # Create an EMPTY local tap on the runner (no GitHub repo involved) and
          # drop our staged formula into it. This avoids tapping/publishing the
          # public tap during a pre-release.
          brew tap-new "${LOCAL_TAP}" --no-git
          tap_dir="$( brew --repository )/Library/Taps/${LOCAL_TAP%/*}/homebrew-${LOCAL_TAP#*/}"
          mkdir -p "${tap_dir}/Formula"
          cp -v "${FORMULA_IN_REPO}" "${tap_dir}/Formula/${FORMULA_NAME}.rb"
          echo "staged formula version: $( brew info --json=v2 "${LOCAL_TAP}/${FORMULA_NAME}" | jq -r '.formulae[0].versions.stable' )"

      # --------------------------------------------------------------------
      # BUILD — the expensive step. Only reached if preflight passed.
      # --------------------------------------------------------------------
      - name: Build bottle from source
        run: |
          set -euo pipefail
          brew install --build-bottle "${LOCAL_TAP}/${FORMULA_NAME}"

      - name: Generate bottle and resolve canonical filename
        id: bottle
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          workdir="$( mktemp -d )"
          cd "${workdir}"

          # Produce the bottle + its authoritative JSON manifest.
          brew bottle --json --no-rebuild "${LOCAL_TAP}/${FORMULA_NAME}"

          json_file="$( ls -1 ./*.bottle.json | head -n1 )"
          if [ -z "${json_file}" ]
          then
            echo "::error::no bottle json produced by 'brew bottle'" >&2
            exit 1
          fi

          # Use the AUTHORITATIVE filename/local_filename/sha256 from the JSON.
          # Do NOT string-munge names — brew computes the expected name from the
          # tag and will not find a hand-customized one.
          canonical="$( jq -r '.. | objects | select(has("tags")) | .tags | to_entries[0].value.filename' "${json_file}" )"
          localname="$( jq -r '.. | objects | select(has("tags")) | .tags | to_entries[0].value.local_filename' "${json_file}" )"
          sha="$(       jq -r '.. | objects | select(has("tags")) | .tags | to_entries[0].value.sha256' "${json_file}" )"
          tagkey="$(    jq -r '.. | objects | select(has("tags")) | .tags | to_entries[0].key' "${json_file}" )"

          if [ -z "${canonical}" ] || [ "${canonical}" = "null" ]
          then
            echo "::error::could not read canonical filename from ${json_file}" >&2
            exit 1
          fi

          # Rename the local artifact to the canonical brew name.
          if [ "${localname}" != "${canonical}" ] && [ -f "${localname}" ]
          then
            mv -v "${localname}" "${canonical}"
          fi

          echo "resolved bottle: ${canonical} (tag=${tagkey}, sha256=${sha})"

          # Export for later steps + job summary.
          echo "canonical=${canonical}"      >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha}"               >> "${GITHUB_OUTPUT}"
          echo "tagkey=${tagkey}"            >> "${GITHUB_OUTPUT}"
          echo "workdir=${workdir}"          >> "${GITHUB_OUTPUT}"

          {
            echo "### Bottle built"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| file | \`${canonical}\` |"
            echo "| tag  | \`${tagkey}\` |"
            echo "| sha256 | \`${sha}\` |"
            echo ""
            echo "Add to the formula \`bottle do\` block:"
            echo ""
            echo '```ruby'
            echo "  sha256 cellar: :any, ${tagkey}: \"${sha}\""
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # --------------------------------------------------------------------
      # UPLOAD — publish to the release verified in preflight.
      # --------------------------------------------------------------------
      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          CANONICAL: ${{ steps.bottle.outputs.canonical }}
          WORKDIR: ${{ steps.bottle.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "${WORKDIR}"
          gh release upload "${TAG}" "${CANONICAL}" \
            --repo "${GITHUB_REPO}" \
            --clobber
          echo "uploaded ${CANONICAL} to ${GITHUB_REPO}@${TAG}"
